<nav class="site-nav" role="navigation" aria-label="Fast Food Navigation">
  <div class="nav-container">
    <a href="{{ '/index.html' | relative_url }}" class="nav-brand">
      <div class="brand-emblem-mcd">🍔</div>
      <div class="brand-text">
        <span class="brand-title">GOLDEN BITES</span>
        <span class="brand-subtitle">Fast Food &bull; 24/7 Drive-Thru</span>
      </div>
    </a>

    <div class="nav-menu">
      <ul class="nav-list">
        {% for item in site.navigation %}
          <li class="nav-item">
            <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>

      <div class="nav-actions">
        <button type="button" class="btn-voice-drivethru" id="voiceDriveThruBtn" title="Speak your order to the Voice AI Assistant">
          <span>🎙️</span>
          <span>Voice Order</span>
        </button>
        <button type="button" class="btn-order-bag" id="openBagBtn">
          <span>🛍️ Bag</span>
          <span class="bag-count" id="navBagCount">0</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<script>
  (function() {
    var voiceBtn = document.getElementById('voiceDriveThruBtn');
    if (voiceBtn) {
      voiceBtn.addEventListener('click', function() {
        var widget = document.querySelector('[data-agent-id]') || document.querySelector('iframe');
        if (widget) {
          widget.scrollIntoView({ behavior: 'smooth' });
        }
        alert('🎙️ Voice Drive-Thru is Active! Click the assistant widget at the bottom right to speak your order (e.g. "I want a Big Mac combo with large fries and a Coke").');
      });
    }

    var bagBtn = document.getElementById('openBagBtn');
    if (bagBtn) {
      bagBtn.addEventListener('click', function() {
        var tray = document.getElementById('orderTray');
        if (tray) {
          tray.classList.toggle('is-visible');
        }
      });
    }
  })();
</script>
